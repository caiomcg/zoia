name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # The README shows a coverage figure. This keeps it from quietly rotting:
  # if line coverage drops below the floor, CI fails and the number has to be
  # looked at rather than silently drifting away from reality.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce the coverage floor
        run: npm run coverage:check

  # The desktop app was invisible to CI until now, which meant a type error or
  # a lint failure only surfaced on someone's Windows machine at package time.
  #
  # Typecheck, lint and format only. The native addon needs MSVC and the
  # installer needs Windows, so neither can run here; both are verified by hand
  # on Windows before a release (docs/DISTRIBUTING.md).
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install without running native build steps
        # The electron binary is a ~100MB download this job never launches.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Typecheck main and preload
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck the renderer
        run: npx tsc --noEmit -p tsconfig.web.json
      # eslint.config.js at the root ignores desktop/, so this is the only
      # place the app is linted. Formatting is not repeated here: the root
      # `prettier --check .` already covers desktop/ and runs in the lint job.
      - run: npm run lint

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check commit messages
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide a dummy environment
        # compose reads .env; the values are irrelevant, only the shape matters.
        run: cp .env.example .env
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build the app image
        run: docker build -t zoia:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret that was committed and later removed is still
          # in the history, and is still compromised.
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
