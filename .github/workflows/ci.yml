name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-update-classification:
    name: Classify desktop update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Classify changed desktop inputs
        run: node scripts/classify-desktop-update.js HEAD

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    # A hang fails here instead of holding a runner for GitHub's six hours.
    timeout-minutes: 15
    strategy:
      matrix:
        # node:sqlite (ADR 0032) needs 22.13 or later; production runs 25.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Without ScyllaDB: the message store's tests skip here, and run in the
      # scylla job below, which cannot hold up or fail the rest.
      - run: npm run test:coverage

  # The README shows a coverage figure. This keeps it from quietly rotting:
  # if line coverage drops below the floor, CI fails and the number has to be
  # looked at rather than silently drifting away from reality.
  coverage:
    runs-on: ubuntu-latest
    # A hang fails here instead of holding a runner for GitHub's six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Measured without ScyllaDB, as the suite runs on a laptop; the figure
      # clears the floor without the message store's tests.
      - name: Enforce the coverage floor
        run: npm run coverage:check

  # The message store against a real ScyllaDB (ADR 0036). Worth knowing about,
  # but a database that is slow to start, or a test that hangs on it, must not
  # hold up a deploy: this job is advisory, and gives up after ten minutes.
  scylla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start ScyllaDB
        run: scripts/ci-scylla.sh
      - run: node --test server/test/messages.test.js
        env:
          SCYLLA_TEST_CONTACT_POINTS: 127.0.0.1

  # The desktop app was invisible to CI until now, which meant a type error or
  # a lint failure only surfaced on someone's Windows machine at package time.
  #
  # Typecheck, lint, test and bundle. The native addon needs MSVC and the
  # installer needs Windows, so neither runs here — release.yml builds both on
  # a Windows runner when a version tag is pushed.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install without running native build steps
        # The electron binary is a ~100MB download this job never launches.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Typecheck main and preload
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck the renderer
        run: npx tsc --noEmit -p tsconfig.web.json
      # eslint.config.js at the root ignores desktop/, so this is the only
      # place the app is linted. Formatting is not repeated here: the root
      # `prettier --check .` already covers desktop/ and runs in the lint job.
      - run: npm run lint
      - run: npm test
      # Bundling is where a bad dependency actually shows up. The typecheck
      # above runs on source and would not notice a Vite or plugin upgrade
      # that breaks the build itself, so without this a broken bundler
      # reached the Windows machine at packaging time instead of here.
      #
      # Tokenless, like every published build: a CI runner has no business
      # holding a pairing token, and the flag stops the build warning about
      # an absence that is deliberate here.
      - name: Bundle main, preload and renderer
        env:
          ZOIA_TOKENLESS_BUILD: '1'
        run: npx electron-vite build

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check commit messages
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide a dummy environment
        # compose reads .env; the values are irrelevant, only the shape matters.
        run: cp .env.example .env
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build the app image
        run: docker build -t zoia:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret that was committed and later removed is still
          # in the history, and is still compromised.
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
