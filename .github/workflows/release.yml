name: Release

# Builds the Windows and macOS binaries and the Android APK, and publishes them.
#
# The desktop builds need no secrets: the published exe carries no server
# address and no credential. Whoever downloads it types their server's address
# and signs in with an account. See docs/adr/0031-accounts-with-admin-approval.md.

on:
  push:
    tags: ['v*']
  # A tag is a one-way door, and this is the first CI that ever compiles the
  # native addon. Running it from a branch first — with publish off — means the
  # compile can be debugged without a tag already pushed.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub Release (otherwise the artifacts are only attached to this run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled: a half-finished release can leave a release object created
  # with no assets attached to it.
  cancel-in-progress: false

jobs:
  ffmpeg:
    # Built, or restored from main's cache, by its own workflow; see ffmpeg.yml
    # for why the cache has to live there rather than here.
    uses: ./.github/workflows/ffmpeg.yml

  build:
    needs: [ffmpeg]
    outputs:
      update_type: ${{ steps.classify.outputs.update_type }}
      base_tag: ${{ steps.classify.outputs.base_tag }}
      minimum_version: ${{ steps.classify.outputs.minimum_version }}
    # Pinned rather than windows-latest. This is the only job in the repo that
    # compiles C++, and the image's Visual Studio and Windows SDK are inputs to
    # the artifact. A silent image migration should not first be noticed as a
    # failed release.
    runs-on: windows-2025
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify desktop update
        id: classify
        working-directory: .
        run: node scripts/classify-desktop-update.js HEAD

      - name: Refuse a tag that disagrees with package.json or has no changelog entry
        if: github.event_name == 'push'
        working-directory: .
        run: node scripts/check-release-version.js "${{ github.ref_name }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # node-gyp needs Python. The image ships one, but pinning it means an
      # image refresh cannot change the toolchain under a release.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # electron-builder lists vendor/ffmpeg-gnutls.exe under extraResources,
      # and it is gitignored, so packaging fails without it. Built by the
      # ffmpeg job above.
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: desktop/vendor

      # Checked on a cache hit too: a cache entry is not trustworthy input to a
      # binary other people download. An SChannel build negotiates DTLS and then
      # dies with "no SRTP Protection Profile was chosen", which looks like a
      # server fault and is not — see desktop/src/main/nvenc.ts.
      - name: Verify the ffmpeg that will be shipped
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content ffmpeg.json | ConvertFrom-Json
          # Two invocations, because they print different things. The version
          # lives in the startup banner, so asking for it while passing
          # -hide_banner returns the configuration and nothing else — which is
          # how the first attempt at this managed to fail on a correct ffmpeg.
          $version = & ./vendor/ffmpeg-gnutls.exe -version 2>&1 | Out-String
          $conf = & ./vendor/ffmpeg-gnutls.exe -hide_banner -buildconf 2>&1 | Out-String
          if ($version -notmatch [regex]::Escape($pin.version)) {
            throw "ffmpeg is not $($pin.version): $($version.Split([Environment]::NewLine)[0])"
          }
          if ($version -notmatch [regex]::Escape("$($pin.version)-zoia")) {
            throw 'ffmpeg is not the patched build from desktop/ffmpeg; its WHIP muxer drops every NACK'
          }
          if ($conf -notmatch '--enable-gnutls') { throw 'ffmpeg is not a GnuTLS build; WHIP cannot work with it' }
          if ($conf -notmatch '--enable-nvenc')  { throw 'ffmpeg has no NVENC support' }
          if ($conf -notmatch '--enable-amf')    { throw 'ffmpeg has no AMF support' }
          if ($conf -notmatch '--enable-libvpl') { throw 'ffmpeg has no Quick Sync support' }
          # Recorded so the exact binary inside a release can be identified later,
          # and so the pin can be tightened to a checksum once one is known good.
          Write-Host "ffmpeg $($pin.version) sha256: $((Get-FileHash vendor/ffmpeg-gnutls.exe -Algorithm SHA256).Hash.ToLower())"

      # With scripts, unlike the ubuntu `desktop` job in ci.yml. That one uses
      # --ignore-scripts because node-window-manager's binding.gyp is
      # Windows-only and cannot build on Linux at all. Here the scripts are the
      # point: node-window-manager has an install hook that runs node-gyp, and
      # without it the window-to-PID addon is simply missing from the package.
      - name: Install dependencies
        run: npm ci

      # The first C++ compile CI has ever done. It needs MSVC with the C++
      # desktop workload and the Windows SDK's C++/WinRT headers, but no GPU and
      # no CUDA SDK: nvEncodeAPI.h is vendored, and nvEncodeAPI64.dll is loaded
      # with LoadLibraryW at runtime. So this proves the addon *builds*. It
      # proves nothing about whether hardware encoding works.
      - name: Build the capture addon
        run: npm run build:native

      - name: Bundle main, preload and renderer
        run: npm run build

      - name: Package the Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Checksum the artifacts
        shell: pwsh
        working-directory: desktop/release
        run: |
          $ErrorActionPreference = 'Stop'
          $updateType = '${{ steps.classify.outputs.update_type }}'
          $files = @(Get-ChildItem -Filter '*.exe')
          if ($files.Count -lt 1) { throw "expected the Windows installer" }
          if ($updateType -eq 'asar') {
            $asar = 'win-unpacked/resources/app.asar'
            if (-not (Test-Path $asar)) { throw "missing OTA payload: $asar" }
            $version = (Get-Content ../package.json | ConvertFrom-Json).version
            Copy-Item $asar "Zoia-OTA-$version.asar"
            $files += Get-Item "Zoia-OTA-$version.asar"
          }
          # Two spaces, the format `sha256sum -c` expects.
          $files | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zoia-windows
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload OTA artifact
        if: steps.classify.outputs.update_type == 'asar'
        uses: actions/upload-artifact@v4
        with:
          name: zoia-ota
          path: desktop/release/*.asar
          retention-days: 7
          if-no-files-found: error

  # The macOS build shares none of the Windows toolchain: no ffmpeg, no
  # capture addon, no MSVC. Sharing goes through Chromium's WebRTC encoder,
  # which is VideoToolbox there. See docs/adr/0025-macos-client.md.
  build-macos:
    # Pinned for the same reason as windows-2025: the Xcode toolchain compiles
    # node-window-manager, and is an input to the artifact.
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - name: Refuse a tag that disagrees with package.json
        if: github.event_name == 'push'
        working-directory: .
        run: node scripts/check-release-version.js "${{ github.ref_name }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # With scripts, for node-window-manager's native build. loopback-capture
      # is an optional dependency and npm skips it here, as it should: it is
      # WASAPI and has nothing to offer a Mac.
      - name: Install dependencies
        run: npm ci

      - name: Bundle main, preload and renderer
        run: npm run build

      # Both architectures from one runner; electron-builder rebuilds the
      # native module for each. Ad-hoc signed (see electron-builder.yml).
      - name: Package the macOS disk images
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Checksum the artifacts
        working-directory: desktop/release
        run: |
          set -euo pipefail
          ls *.dmg >/dev/null
          shasum -a 256 *.dmg > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zoia-macos
          path: |
            desktop/release/*.dmg
            desktop/release/SHA256SUMS-macos.txt
          retention-days: 7
          if-no-files-found: error

  # The Android viewer. Unlike the desktop builds this one needs secrets: an
  # APK that is not signed will not install, and every update has to be signed
  # with the same key or Android refuses it over the installed one. The keystore
  # lives only in the repository secrets, base64-encoded.
  build-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse a tag that disagrees with package.json
        if: github.event_name == 'push'
        working-directory: .
        run: node scripts/check-release-version.js "${{ github.ref_name }}"

      # A publishing run must not ship an unsigned APK. A manual run without
      # the key and without publish still builds, to prove the compile.
      - name: Refuse to release without the signing key
        if: (github.event_name == 'push' || inputs.publish) && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release APK would be unsigned."
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zoia.jks"
          echo "ZOIA_ANDROID_KEYSTORE=$RUNNER_TEMP/zoia.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          ZOIA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZOIA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZOIA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name and checksum the APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          version=$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")
          if [ "$HAS_KEYSTORE" = true ]; then
            name="Zoia-$version.apk"
          else
            name="Zoia-$version-unsigned.apk"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist-android"
          cp app-release*.apk "$GITHUB_WORKSPACE/dist-android/$name"
          cd "$GITHUB_WORKSPACE/dist-android"
          sha256sum "$name" > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zoia-android
          path: dist-android/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [build, build-macos, build-android]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # The only elevated permission in the repo, on the only job that needs it.
    # It runs no third-party code and installs nothing, so `contents: write` is
    # never in scope while ~1500 npm packages are executing.
    permissions:
      contents: write
    steps:
      # Only for the history: the notes are written from the commits since the
      # previous tag. Nothing is installed; the script is plain Node.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: zoia-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: zoia-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: zoia-android
          path: dist
      - name: Download OTA artifact
        if: needs.build.outputs.update_type == 'asar'
        uses: actions/download-artifact@v4
        with:
          name: zoia-ota
          path: dist
      # Grouped from the Conventional Commits rather than GitHub's list of
      # merged PRs, which is empty for commits pushed straight to main. The app
      # shows the same notes in Settings -> What's new.
      - name: Write the release notes
        run: node scripts/release-notes.js "${{ github.ref_name }}" > release-notes.md
      # What the installed apps read to learn about this release: from 0.4.4
      # on they look at the latest release, not at a file on main, so nothing
      # here pushes to main. Checksums are of the files in dist/, which are
      # the ones uploaded below. A `none` release writes nothing; a tag always
      # bumps the desktop version, which is enough to make it `asar`.
      # Tag pushes only: a workflow_dispatch run is named for a branch, and
      # there is no version to describe.
      - name: Write update.json
        if: github.event_name == 'push'
        run: |
          node scripts/write-updater-manifest.js "${{ github.ref_name }}" dist \
            "${{ needs.build.outputs.update_type }}" "${{ needs.build.outputs.minimum_version }}" \
            --out dist/update.json
      # --verify-tag refuses to invent a tag that does not exist, so a typo
      # fails instead of publishing under a name nobody tagged. Re-running a
      # tag fails too, which is correct: deleting the old release is a
      # deliberate act.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Zoia ${{ github.ref_name }}" \
            --verify-tag \
            --notes-file release-notes.md
