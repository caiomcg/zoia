# LiveKit Ingress — hardware-encoded video arrives here over WHIP.
#
# Why this exists: Chromium's WebRTC stack exposes no hardware encoder on
# Windows (measured: mediaCapabilities reports powerEfficient=false for every
# codec, in Electron *and* in stock Chrome). The desktop app therefore encodes
# with NVENC via ffmpeg and publishes over WHIP instead, and this service turns
# that into an ordinary participant track in the room.
#
# Deliberately NOT exposed to the internet: the broadcaster is on the same LAN
# as this server, so no port forwarding is needed. Remote publishers fall back
# to the in-app Chromium path.

redis:
  address: 127.0.0.1:6379

ws_url: ws://127.0.0.1:7880

# Signalling for WHIP. Media itself travels over the UDP range below.
whip_port: 8085
health_port: 9090

rtc_config:
  udp_port: 7885
  use_external_ip: false

# Without these the service computes "max cost: 0" and refuses every request,
# because the defaults are below its own stated minimums.
#
# whip_bypass_transcoding_cpu_cost is the one that matters: the desktop app
# already sends H.264 that the SFU can forward as-is, so ingress repackages
# rather than re-encodes. This box has 4 cores and no GPU — transcoding here
# would undo the entire point of encoding on the client's NVENC.
cpu_cost:
  whip_cpu_cost: 1
  whip_bypass_transcoding_cpu_cost: 0.05
  rtmp_cpu_cost: 1
  url_cpu_cost: 1

logging:
  level: info
  json: false
