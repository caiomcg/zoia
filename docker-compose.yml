services:
  # Public entry point. The only container that publishes ports to the world.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
      ZOIA_HOSTNAME: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      SFU_HOSTNAME: ${SFU_HOST:?set SFU_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — must persist across restarts
      - caddy_config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - app

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    # Host networking is not an optimisation here. WebRTC behind Docker's NAT
    # means wrestling ICE against a second layer of address translation; host
    # mode sidesteps it entirely.
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?set LIVEKIT_KEYS in .env}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Ingress and the SFU share state through redis. Bound to loopback on the
  # host so nothing outside the box can reach it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no

  # Accepts NVENC-encoded video over WHIP from the desktop app and republishes
  # it into the room. Host networking for the same reason as livekit: WebRTC
  # through Docker's NAT means fighting a second layer of address translation.
  ingress:
    image: livekit/ingress:v1.4.3
    restart: unless-stopped
    network_mode: host
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml:ro
    depends_on:
      - redis
      - livekit

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # livekit runs in the host network namespace.
      LIVEKIT_API_URL: http://host.docker.internal:7880
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # No published ports: the app is reachable only through caddy.
    expose:
      - '3000'
    volumes:
      # The key store lives on the server and survives redeploys.
      - ./server/data:/app/server/data
    depends_on:
      - livekit

volumes:
  caddy_data:
  caddy_config:
