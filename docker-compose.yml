services:
  # Public entry point. The only container that publishes ports to the world.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
      ZOIA_HOSTNAME: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      SFU_HOSTNAME: ${SFU_HOST:?set SFU_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Server-local extra sites, e.g. the homolog environment (ADR 0035).
      - ./caddy/sites:/etc/caddy/sites:ro
      - caddy_data:/data # certificates — must persist across restarts
      - caddy_config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - app

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    # Host networking is not an optimisation here. WebRTC behind Docker's NAT
    # means wrestling ICE against a second layer of address translation; host
    # mode sidesteps it entirely.
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?set LIVEKIT_KEYS in .env}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Ingress and the SFU share state through redis. Bound to loopback on the
  # host so nothing outside the box can reach it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no

  # Chat messages (ADR 0036). On the compose network only, with no published
  # ports: the app is the one thing that talks to it. One shard and 1G, so it
  # leaves the VM to LiveKit; developer mode skips the I/O tuning a shared VM
  # disk would fail.
  scylla:
    image: scylladb/scylla:2025.1
    restart: unless-stopped
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    expose:
      - '9042'
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ['CMD-SHELL', "cqlsh -e 'SELECT now() FROM system.local' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # livekit runs in the host network namespace.
      LIVEKIT_API_URL: http://host.docker.internal:7880
      SCYLLA_CONTACT_POINTS: scylla
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # No published ports: the app is reachable only through caddy.
    expose:
      - '3000'
    volumes:
      # The key store lives on the server and survives redeploys.
      - ./server/data:/app/server/data
    # Not waiting for scylla to be healthy: if it is down, chat is down and
    # broadcasting carries on. The app connects when it comes up.
    depends_on:
      - livekit
      - scylla

volumes:
  caddy_data:
  caddy_config:
  scylla_data:
