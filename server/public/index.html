<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoia</title>
    <link rel="icon" href="icon.png" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Zoia is a self-hosted screen sharing app for Windows. This address serves the desktop app; there is nothing to use in a browser."
    />
    <style>
      /* Self-contained on purpose: this page outlives the client it replaced,
         and should not depend on a stylesheet that may be deleted with it. */
      :root {
        color-scheme: dark;
        --bg: #1a1b1e;
        --text: #f2f3f5;
        --muted: #949ba4;
        --accent: #5865f2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        gap: 22px;
        align-items: center;
        justify-content: center;
        padding: 32px;
        font:
          15px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--text);
        text-align: center;
        background: var(--bg);
      }

      img {
        width: min(320px, 74vw);
        height: auto;
        user-select: none;
      }

      p {
        max-width: 44ch;
        margin: 0;
        color: var(--muted);
      }

      a.repo {
        display: inline-block;
        padding: 10px 18px;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        background: var(--accent);
        border-radius: 8px;
      }

      a.repo:hover {
        background: #4752c4;
      }

      footer {
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Zoia" draggable="false" />

    <p>
      Zoia is a desktop app for sharing a screen, a window or a camera with a few friends &mdash;
      along with that application&rsquo;s own sound. There is nothing to use here in a browser.
    </p>

    <a class="repo" href="https://github.com/caiomcg/zoia" rel="noopener">View the repository</a>

    <footer>Self-hosted. Windows only.</footer>
  </body>
</html>
