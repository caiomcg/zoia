<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoia — assistir</title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <main id="login-screen" class="screen login-screen" hidden>
      <img class="logo" src="logo.png" alt="Zoia" draggable="false" />
      <h1>Entre na sala</h1>
      <p class="muted">Cole o convite recebido para assistir às transmissões.</p>
      <form id="login-form" class="login-form">
        <label for="invite-key">Chave do convite</label>
        <input id="invite-key" name="key" autocomplete="off" required />
        <button class="primary" type="submit">Entrar</button>
      </form>
      <p id="login-error" class="error" role="alert" hidden></p>
    </main>

    <main id="loading-screen" class="screen" aria-live="polite">
      <p>Conectando à sala…</p>
    </main>

    <main id="room-screen" class="room" hidden>
      <header class="topbar">
        <div class="brand-wrap">
          <img class="brand" src="logo.png" alt="Zoia" draggable="false" />
          <span id="connection-status" class="status">Conectando…</span>
        </div>
        <span id="room-name" class="muted">Sala Zoia</span>
        <button id="logout" class="small-button" type="button">Sair</button>
      </header>

      <p id="room-message" class="room-message" role="status" hidden></p>

      <div class="room-body">
        <section id="grid" class="grid">
          <div class="empty-state">
            <h1>Ninguém está transmitindo</h1>
            <p class="muted">Quando alguém compartilhar a tela, ela aparecerá aqui.</p>
          </div>
        </section>

        <aside class="sidebar">
          <div class="sidebar-heading">
            <h2>Ao vivo</h2>
            <span id="watching-count" class="muted">Assistindo 0 de 0</span>
          </div>
          <div class="live-actions">
            <button id="watch-all" class="small-button" type="button">Assistir todas</button>
            <button id="watch-none" class="small-button" type="button">Parar todas</button>
          </div>
          <div id="live-list" class="live-list"></div>
          <p id="no-live" class="muted">Nenhuma transmissão no momento.</p>
        </aside>
      </div>
    </main>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
