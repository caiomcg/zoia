<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Zoia</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>"
    />
  </head>
  <body>
    <main id="login" class="screen" hidden>
      <div class="card">
        <h1>Zoia</h1>
        <p class="muted">Enter the invite key you were sent.</p>
        <form id="login-form" autocomplete="off">
          <label class="sr-only" for="key-input">Invite key</label>
          <input
            id="key-input"
            name="key"
            type="password"
            placeholder="zoia_…"
            spellcheck="false"
            autocapitalize="off"
            required
          />
          <button type="submit" class="primary">Sign in</button>
        </form>
        <p id="login-error" class="error" role="alert" hidden></p>
      </div>
    </main>

    <div id="room" class="screen" hidden>
      <header class="bar">
        <span class="brand">Zoia</span>
        <span id="status" class="pill">connecting…</span>
        <span class="spacer"></span>
        <button id="people-toggle" class="ghost" type="button" aria-expanded="false">
          <span id="people-count">0</span> in the room
        </button>
        <span id="whoami" class="muted"></span>
        <button id="logout" class="ghost" type="button">Sign out</button>
      </header>

      <div class="body">
        <section id="stage" class="stage">
          <video id="video" playsinline autoplay muted></video>
          <!-- Remote audio lives on its own element. Attaching a second track to
               the video element would replace its stream and silence the audio. -->
          <audio id="remote-audio" autoplay></audio>

          <div id="overlay" class="overlay">
            <div class="overlay-inner">
              <h2 id="overlay-title">Connecting…</h2>
              <p id="overlay-text" class="muted"></p>
              <button id="overlay-action" class="primary" type="button" hidden></button>
              <p id="overlay-hint" class="hint" hidden></p>
            </div>
          </div>

          <button id="unmute" class="floating" type="button" hidden>🔇 Tap for sound</button>
        </section>

        <aside id="people" class="people" hidden>
          <h3>In the room</h3>
          <ul id="people-list"></ul>
        </aside>
      </div>

      <footer class="bar">
        <button id="share" class="primary" type="button">Start broadcasting</button>
        <button id="stop" class="danger" type="button" hidden>Stop broadcasting</button>
        <button id="fullscreen" class="ghost" type="button">Fullscreen</button>
        <span id="share-note" class="muted"></span>
      </footer>
    </div>

    <p id="toast" class="toast" role="status" hidden></p>

    <script type="module" src="/app.js"></script>
  </body>
</html>
